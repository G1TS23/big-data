# Les trois commandes d'installation, en tâches ponctuelles.
#
# Elles reproduisent l'ordre imposé en local et documenté dans le guide
# d'exploitation : init, puis acces, puis metabase. « eds metabase » a besoin
# des comptes que « eds acces » vient de créer.
#
# À lancer une fois, dans cet ordre :
#   kubectl create job --from=cronjob/eds-pipeline eds-init -n eds  # puis adapter args
#   kubectl apply -f 40-installation.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: eds-init
  namespace: eds
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      # Aucun de ces conteneurs ne parle à l'API de Kubernetes. Sans cette ligne,
      # le cluster leur monte pourtant à chacun un jeton de compte de service :
      # un conteneur compromis y trouverait une porte d'entrée sur le plan de
      # contrôle, gratuitement et pour rien.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: eds
          image: credschurecette.azurecr.io/eds:1.0.0
          args: ["eds", "init"]
          envFrom:
            - configMapRef:
                name: eds-config
            - secretRef:
                name: eds-secrets
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse.eds.svc.cluster.local
          # Trois installations brèves — quelques secondes de DDL, de création de
          # comptes, de publication de cartes. Sans requête déclarée, un pod tombe
          # en qualité de service « BestEffort » et devient le premier évincé sous
          # pression : au pire moment, puisque c'est l'installation qui échouerait.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eds-acces
  namespace: eds
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: eds
          image: credschurecette.azurecr.io/eds:1.0.0
          args: ["eds", "acces"]
          envFrom:
            - configMapRef:
                name: eds-config
            - secretRef:
                name: eds-secrets
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse.eds.svc.cluster.local
            - name: METABASE_URL
              value: http://metabase.eds.svc.cluster.local:3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eds-metabase
  namespace: eds
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: eds
          image: credschurecette.azurecr.io/eds:1.0.0
          args: ["eds", "metabase"]
          envFrom:
            - configMapRef:
                name: eds-config
            - secretRef:
                name: eds-secrets
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse.eds.svc.cluster.local
            - name: CLICKHOUSE_DOCKER_HOST
              value: clickhouse.eds.svc.cluster.local
            - name: METABASE_URL
              value: http://metabase.eds.svc.cluster.local:3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
