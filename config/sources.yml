# Déclaration des flux déposés par le CHU.
#
# La politique de confidentialité est déclarative et centralisée ici : aucune
# règle de pseudonymisation n'est dispersée dans le code. Ce fichier est la
# pièce à produire pour justifier « aucune donnée identifiante n'entre ».
#
# mode:
#   incremental — un dépôt par jour, ingéré une fois (idempotent sur l'empreinte)
#   full        — nomenclature, remplacée intégralement à chaque dépôt

sources:

  patients:
    format: csv
    path: "patients/{date}/patients.csv"
    mode: incremental
    source_columns: [patient_id, nir, nom, prenom, birth_date, sex, region_code]
    privacy:
      # Pseudonyme stable : les jointures survivent, l'identité non.
      hash:
        - {from: patient_id, to: patient_key}
      # Généralisation : la date complète est un quasi-identifiant.
      generalize:
        - {from: birth_date, to: birth_year, rule: year}
      # Identifiants directs, supprimés avant écriture dans le lake.
      drop: [patient_id, nir, nom, prenom, birth_date]
    lake_columns: [patient_key, birth_year, sex, region_code]
    bronze:
      table: bronze.patients
      format: CSVWithNames
      # Schéma déclaré à l'insertion : ClickHouse lit le fichier avec ces types
      # via input(), sans que Python ne touche une seule ligne de données.
      schema: "patient_key String, birth_year Nullable(UInt16), sex String, region_code String"

  sejours:
    format: csv
    path: "sejours/{date}/sejours.csv"
    mode: incremental
    source_columns: [stay_id, patient_id, service_code, admission_ts, discharge_ts, admission_mode, discharge_mode]
    privacy:
      # Même sel, même fonction : sans quoi la jointure patients↔séjours casse.
      hash:
        - {from: patient_id, to: patient_key}
      drop: [patient_id]
    lake_columns: [stay_id, patient_key, service_code, admission_ts, discharge_ts, admission_mode, discharge_mode]
    bronze:
      table: bronze.sejours
      format: CSVWithNames
      schema: "stay_id String, patient_key String, service_code String, admission_ts Nullable(DateTime), discharge_ts Nullable(DateTime), admission_mode String, discharge_mode String"

  diagnostics:
    format: json
    path: "diagnostics/{date}/diagnostics.json"
    mode: incremental
    # Aucune donnée identifiante : copie brute, octet pour octet.
    # ClickHouse ingère le tableau JSON tel quel (JSONEachRow) ; l'aplatissement
    # des codes imbriqués se fait en SQL, dans le moteur.
    bronze:
      table: bronze.diagnostics
      format: JSONEachRow
      schema: "stay_id String, diagnostics Array(Tuple(code_cim10 String, type String))"

  monitoring:
    format: parquet
    path: "monitoring/{date}/monitoring.parquet"
    mode: incremental
    # Rattaché au séjour, jamais au patient : copie brute.
    bronze:
      table: bronze.monitoring
      format: Parquet
      schema: "stay_id String, ts DateTime64(6), heart_rate Nullable(Int64), spo2 Nullable(Int64), temp_c Nullable(Float64)"
      # L'horodatage du Parquet est en microsecondes ; la table le stocke à la
      # seconde, précision suffisante pour des constantes relevées à la minute.
      cast: {ts: "toDateTime(ts)"}

  referentiels:
    format: csv
    mode: full
    files:
      - path: "referentiels/{date}/services.csv"
        source_columns: [service_code, service_label]
        bronze:
          table: bronze.services
          format: CSVWithNames
          schema: "service_code String, service_label String"
      - path: "referentiels/{date}/cim10.csv"
        source_columns: [code_cim10, libelle]
        bronze:
          table: bronze.cim10
          format: CSVWithNames
          schema: "code_cim10 String, libelle String"
