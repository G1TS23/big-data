# Règles métier de la couche silver.
#
# Elles vivent ici et non dans le SQL : ce sont des hypothèses du projet, pas
# des constantes du modèle. Le sujet rappelle « vous n'êtes pas médecins » —
# quelqu'un qui l'est doit pouvoir les réviser sans lire une ligne de requête.
#
# Chaque valeur est passée en paramètre aux requêtes et consignée dans
# ops.parametres à chaque exécution : on sait toujours avec quels seuils un
# chiffre a été produit.

# ── Bornes physiologiques ───────────────────────────────────────────────────
# Au-delà, la valeur est FAUSSE (capteur, saisie) : la ligne est écartée.
# Fournies par le sujet.
bornes:
  heart_rate: {min: 20,   max: 250}    # bpm
  spo2:       {min: 50,   max: 100}    # %
  temp_c:     {min: 30.0, max: 45.0}   # °C

# ── Seuils cliniques d'alerte ───────────────────────────────────────────────
# En deçà ou au-delà, la valeur est VRAIE mais le patient va mal : la ligne est
# conservée et signalée.
#
# Valeurs FOURNIES par le commanditaire dans sa feuille de réponses attendues :
# SpO2 < 92 · FC < 50 ou > 100 · T° > 38,5. Elles font foi, et le décompte des
# alertes s'y conforme au relevé près sur les 30 jours observés.
#
# Chaque seuil tombe par ailleurs dans une plage VIDE des données observées —
# la FC saute de 49 à 60 puis de 95 à 101, la SpO2 de 91 à 96, la température
# de 37,6 à 38,6 : le décompte ne dépend donc pas de leur réglage fin, et un
# clinicien peut les réviser sans rien casser.
# Motifs : bradycardie, tachycardie, hypoxémie, fièvre.
alertes:
  heart_rate: {bas: 50, haut: 100}
  spo2:       {bas: 92}
  temp_c:     {haut: 38.5}

# ── Autres règles ───────────────────────────────────────────────────────────
annee_naissance_min: 1900          # borne basse de plausibilité
readmission_fenetre_jours: 30      # définition du taux de réadmission
k_anonymite: 5                     # effectif minimal diffusable en recherche
